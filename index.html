<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <style>
        
        body {
            font-family: sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 40px 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 5px;
        }
        p {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }
        .link-btn {
            display: block;
            background-color: #ffffff;
            color: #333;
            text-decoration: none;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-weight: bold;
            border: 2px solid #ddd;
            transition: all 0.3s;
        }
        .link-btn:hover {
            background-color: #000;
            color: #fff;
            border-color: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="5767421358433308704_121.jpg" alt="الصورة الشخصية">
        <h1>Raghad Esmail</h1>
        <p>Junior Web Developer</p> 
        <a class="link-btn" href="https://github.com/raghadesmailfakry-star" target="_blank">معرض أعمالي على GitHub</a>
    
    </div>

</body>
</html>
